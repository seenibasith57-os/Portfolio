<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Container Dark Window -->
  <rect width="800" height="450" rx="16" fill="url(#ragBg)"/>
  
  <!-- Terminal Window Header -->
  <rect width="800" height="40" fill="url(#termHeader)" rx="16"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Terminal RAG Chatbot — Local Multi-PDF Retrieval &amp; FLAN-T5</text>

  <!-- CLI Screen Viewport -->
  <rect x="30" y="55" width="740" height="370" rx="10" fill="#030712" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Left Side: Terminal Output Stream -->
  <!-- Prompt Line 1 -->
  <text x="50" y="90" font-family="monospace" font-size="13" fill="#38bdf8">[rag-engine] $ <tspan fill="#f1f5f9">python main.py --docs ./research_papers/</tspan></text>
  <text x="50" y="112" font-family="monospace" font-size="12" fill="#34d399">✔ Loaded 4 PDF documents (128 text chunks indexed)</text>
  <text x="50" y="132" font-family="monospace" font-size="12" fill="#818cf8">✔ Embeddings: Sentence-Transformers (all-MiniLM-L6-v2) + FAISS Index</text>

  <!-- Query Block -->
  <rect x="50" y="150" width="460" height="36" rx="6" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(99, 102, 241, 0.4)"/>
  <text x="65" y="173" font-family="monospace" font-size="12" fill="#38bdf8">Query: <tspan fill="#f8fafc">What are the main performance evaluation metrics?</tspan></text>

  <!-- RAG Processing Flow Step -->
  <g transform="translate(50, 200)">
    <text x="0" y="15" font-family="monospace" font-size="11" fill="#94a3b8">⚡ Hybrid Retrieval Pipeline:</text>
    <rect x="0" y="25" width="130" height="26" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="65" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">BM25 Search</text>

    <text x="142" y="42" font-family="monospace" font-size="14" fill="#64748b">+</text>

    <rect x="160" y="25" width="130" height="26" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="225" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#818cf8">FAISS Vector</text>

    <text x="302" y="42" font-family="monospace" font-size="14" fill="#64748b">→</text>

    <rect x="320" y="25" width="130" height="26" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
    <text x="385" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#c084fc">Cross-Encoder</text>
  </g>

  <!-- Model Answer & Citation -->
  <rect x="50" y="275" width="460" height="130" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.3)"/>
  <text x="65" y="298" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399">🤖 FLAN-T5 Answer:</text>
  <text x="65" y="322" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">"The key metrics evaluated include Accuracy, Precision, Recall,</text>
  <text x="65" y="340" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">and F1-Score across Cross-Encoder reranked document pages."</text>

  <rect x="65" y="358" width="430" height="32" rx="4" fill="rgba(30, 41, 59, 0.9)"/>
  <text x="75" y="378" font-family="monospace" font-size="11" fill="#f59e0b">📌 Source Citation: [paper_v2.pdf - Page 14, Chunk #3]</text>

  <!-- Right Panel: Architecture Features Card -->
  <rect x="530" y="75" width="220" height="330" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
  <text x="640" y="102" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Local RAG Stack</text>

  <g transform="translate(545, 120)">
    <!-- Tech item 1 -->
    <rect x="0" y="0" width="190" height="36" rx="6" fill="rgba(56, 189, 248, 0.1)"/>
    <text x="12" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Sentence Transformers</text>

    <!-- Tech item 2 -->
    <rect x="0" y="46" width="190" height="36" rx="6" fill="rgba(99, 102, 241, 0.1)"/>
    <text x="12" y="68" font-family="sans-serif" font-size="11" font-weight="600" fill="#818cf8">FAISS Vector Database</text>

    <!-- Tech item 3 -->
    <rect x="0" y="92" width="190" height="36" rx="6" fill="rgba(168, 85, 247, 0.1)"/>
    <text x="12" y="114" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc">BM25 + Cross-Encoder</text>

    <!-- Tech item 4 -->
    <rect x="0" y="138" width="190" height="36" rx="6" fill="rgba(52, 211, 153, 0.1)"/>
    <text x="12" y="160" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">FLAN-T5 Local Model</text>

    <!-- Tech item 5 -->
    <rect x="0" y="184" width="190" height="36" rx="6" fill="rgba(245, 158, 11, 0.1)"/>
    <text x="12" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24">100% Offline / No API Key</text>
  </g>
</svg>
